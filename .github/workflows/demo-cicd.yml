name: Session 16 — CI/CD Pipeline Demo

on:
  push:
    branches: [ main ]
    paths:
      - 'submissions/16-cicd/**'
      - '.github/workflows/demo-cicd.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Automated Pytest
        run: |
          pytest -v

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/
          retention-days: 5

  build-and-deliver:
    name: Container Build & GHCR Delivery
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Demo Image
        uses: docker/build-push-action@v5
        with:
          context: ./session6-7-docker/python-app
          file: ./session6-7-docker/python-app/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/demo-app:${{ github.sha }}
