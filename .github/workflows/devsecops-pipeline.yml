name: Session 17 — DevSecOps Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'submissions/17-devsecops/**'
      - '.github/workflows/devsecops-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  code-security:
    name: SAST, SCA & Secret Scanning Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. Secret Scanning Gate
      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # 2. SAST (Static Application Security Testing) Gate
      - name: Bandit Security Linter (SAST)
        run: |
          pip install bandit
          # Scan codebase, exclude tests, exit with error on medium/high severity
          bandit -r ./session21-python/backend/app -ll -ii

      # 3. SCA (Software Composition Analysis) Gate
      - name: Pip-Audit Dependency Vulnerability Scan (SCA)
        run: |
          pip install pip-audit
          pip-audit -r ./session21-python/backend/requirements.txt --desc on

  container-security:
    name: Docker Build & Trivy Image Security Gate
    needs: code-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # 4. Build Backend Image Locally for Scanning
      - name: Build Application Image
        run: |
          docker build -t test-backend:${{ github.sha }} ./session21-python/backend

      # 5. Container Image Vulnerability Scanning (Trivy) Gate
      - name: Aqua Security Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-backend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 6. Publish to GHCR after passing security gates
      - name: Log in to GHCR
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Verified Image to GHCR
        if: success()
        run: |
          docker tag test-backend:${{ github.sha }} ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          # docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
